apiVersion: harness.io/v1
kind: Workflow
identifier: developer_welcome_workflow
name: Developer Welcome
orgIdentifier: default
projectIdentifier: artist-react1
spec:
  owner: group:account/_account_all_users
  type: service
  parameters:
    - title: Your Details
      required:
        - developer_name
        - team_name
        - favorite_language
      properties:
        developer_name:
          type: string
          title: Your Name
          description: Enter your full name
        team_name:
          type: string
          title: Team
          description: Which team are you on?
        favorite_language:
          type: string
          title: Favorite Language
          description: Your favorite programming language
  steps:
    - id: run-welcome-pipeline
      name: Run Welcome Pipeline
      action: harness:pipeline:run
      input:
        url: https://app.harness.io/ng/account/YOUR_ACCOUNT_ID/module/idp/orgs/default/projects/artist-react1/pipelines/developer_welcome_pipeline/pipeline-studio
        inputset:
          developer_name: ${{ parameters.developer_name }}
          team_name: ${{ parameters.team_name }}
          favorite_language: ${{ parameters.favorite_language }}
  output:
    text:
      - title: Status
        content: "Welcome, ${{ parameters.developer_name }}! Your onboarding pipeline has been triggered."
